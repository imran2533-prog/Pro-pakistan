<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pakistan Recovery Oasis | Packages</title>

    <link rel="icon" type="image/jpg" href="../Images/favv.jpg">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #043102;
            --accent: #f9a825;
            --light: #f6f8f5;
            --dark: #0f172a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--light);
            color: var(--dark);
        }

        /* HERO */
        .packages-hero {
            min-height: 55vh;
            background:
                linear-gradient(rgba(4, 49, 2, 0.82), rgba(4, 49, 2, 0.65)),
                url("../Images/gallery.jpeg");
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 80px 20px;
        }

        .hero-content {
            max-width: 850px;
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.78);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 25px;
            transition: 0.3s ease;
        }

        .back-home:hover {
            color: var(--accent);
            transform: translateX(-4px);
        }

        .packages-hero h1 {
            color: #fff;
            font-size: clamp(42px, 6vw, 76px);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 18px;
        }

        .packages-hero p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 18px;
            line-height: 1.7;
            max-width: 700px;
            margin: 0 auto;
        }

        /* PACKAGES SECTION */
        .packages-section {
            padding: 90px 0;
            background: var(--light);
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .section-heading {
            text-align: center;
            margin-bottom: 45px;
        }

        .section-heading span {
            display: block;
            color: var(--primary);
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .section-heading h2 {
            color: var(--dark);
            font-size: clamp(32px, 4vw, 48px);
            font-weight: 800;
            line-height: 1.2;
        }

        .package-image-card {
            width: 100%;
            background: #ffffff;
            padding: 12px;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 24px 60px rgba(4, 49, 2, 0.14);
            border: 1px solid rgba(4, 49, 2, 0.08);
        }

        .package-image-card img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 20px;
            object-fit: contain;
            object-position: center top;
        }

        /* FOOTER */
        .simple-footer {
            background: var(--primary);
            color: #d1fae5;
            text-align: center;
            padding: 25px 15px;
            font-size: 14px;
        }

        .simple-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
        }

        /* WHATSAPP */
        .whatsapp-float {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: #25d366;
            color: white;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.5);
            z-index: 9999;
            transition: transform 0.3s;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            .packages-hero {
                min-height: 48vh;
                padding: 70px 18px;
            }

            .packages-hero p {
                font-size: 15px;
            }

            .packages-section {
                padding: 60px 0;
            }

            .container {
                padding: 0 16px;
            }

            .package-image-card {
                border-radius: 20px;
                padding: 7px;
            }

            .package-image-card img {
                border-radius: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- HERO SECTION -->
    <section class="packages-hero">
        <div class="hero-content">
            <a href="../index.html" class="back-home">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Back to Home</span>
            </a>

            <h1>Our Packages</h1>
            <p>
                Explore our professional recovery packages designed to provide care,
                comfort, and complete support throughout the healing journey.
            </p>
        </div>
    </section>

    <!-- PACKAGES IMAGE SECTION -->
    <section class="packages-section" id="packages">
        <div class="container">

            <div class="section-heading">
                <span>Recovery Plans</span>
                <h2>Packages</h2>
            </div>

            <div class="package-image-card">
                <img src="../Images/gallery.jpeg" alt="Pakistan Recovery Oasis Packages">
            </div>

        </div>
    </section>

    <!-- WHATSAPP BUTTON -->
    <a href="https://wa.me/923399123489" class="whatsapp-float" target="_blank" title="Chat on WhatsApp">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <!-- FOOTER -->
    <footer class="simple-footer">
        <p>&copy; 2026 Pakistan Recovery Oasis. Powered by <a href="https://codedclouds.org">CODEDCLOUDS</a></p>
    </footer>

<script src="https://cdn.zanderio.ai/widget/loader.js" data-id="wdg_sBYddBA6MOHyblo8BJmFeSR4" defer></script>
</body>
</html>
